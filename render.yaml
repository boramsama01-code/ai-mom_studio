services:
  - type: web
    name: woori-ledger
    runtime: node
    repo: https://github.com/boramsama01-code/ai-mom_studio
    branch: woori-ledger-render
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: ledger-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_SETUP_KEY
        generateValue: true
