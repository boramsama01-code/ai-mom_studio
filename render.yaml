# Render Blueprint — 관리자 웹앱 (무료 플랜)
# DB는 Render 무료 DB(30일 후 만료)가 아니라 Neon을 사용합니다. APP_DATABASE_URL에 Neon 주소를 넣으세요.
services:
  - type: web
    name: ai-mom-studio
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_REVIEW_CHAT_ID
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: AUTO_COLLECT
        value: "false"
      - key: AUTO_GENERATE
        value: "false"
      - key: AUTO_PUBLISH
        value: "false"
