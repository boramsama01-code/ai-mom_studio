name: Verify Google News resolution
on:
  push:
    branches: [fix/google-news-resolution-20261029]
permissions:
  contents: read
concurrency:
  group: verify-google-news-resolution
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aimom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aimom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-report.json
      - run: npm run build
      - name: Read-only checks on three previously failed collection articles
        env:
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
        run: ./node_modules/.bin/tsx scripts/check-google-news-resolution.ts
      - name: Summarize test failures without full application logs
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          if (existsSync('test-report.json')) {
            const r = JSON.parse(readFileSync('test-report.json','utf8'));
            console.log(`Tests: ${r.numPassedTests}/${r.numTotalTests} passed, ${r.numFailedTests} failed.`);
            for (const f of r.testResults ?? []) for (const t of f.assertionResults ?? []) if (t.status === 'failed') console.log(t.fullName, t.failureMessages);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-news-verification
          path: |
            test-report.json
            google-news-resolution-report.json
          if-no-files-found: ignore
          retention-days: 3
