name: Recover verified publisher sources
on:
  push:
    branches: [fix/publisher-first-20261031]
permissions:
  contents: read
concurrency:
  group: publisher-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publisher-first-20261031
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Recover exactly source 3410 and 3429 after identity and title checks
        env:
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          REPAIR_SOURCES: "true"
        run: ./node_modules/.bin/tsx scripts/check-publisher-recovery.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-source-recovery
          path: publisher-recovery.json
          if-no-files-found: error
          retention-days: 3
