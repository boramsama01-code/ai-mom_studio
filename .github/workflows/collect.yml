# 수집 워커 — 한 번 실행 후 종료
# 자동 예약 수집은 사용하지 않습니다. workflow_dispatch로 요청한 수동 수집만 실행합니다.
# 수동 실행은 [자동 수집] 스위치와 무관합니다. 연결만 확인하려면 check_only를 선택하세요.
name: collect
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널 slug (비우면 활성 검색어가 있는 모든 채널)"
        required: false
        default: ""
      check_only:
        description: "연결만 확인 (수집·AI·알림·게시 안 함)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      # 화면(채널 설정)에서 입력한 키를 풀기 위한 값 — Render의 APP_SESSION_SECRET과 같은 값
      APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
      APP_SECRETS_KEY: ${{ secrets.APP_SECRETS_KEY }}
      # 아래 키들은 선택: 화면에서 입력했다면 비워 둬도 됩니다(여기 값이 있으면 이 값이 우선)
      APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://spacepenguin.onrender.com' }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
      AUTO_COLLECT: ${{ vars.AUTO_COLLECT || 'false' }}
      AUTO_GENERATE: ${{ vars.AUTO_GENERATE || 'false' }}
      COLLECT_REVIEW_NOTIFICATIONS: ${{ vars.COLLECT_REVIEW_NOTIFICATIONS || 'false' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
    steps:
      - name: 연결 정보 확인
        if: ${{ env.APP_DATABASE_URL == '' }}
        run: |
          echo "::error::APP_DATABASE_URL이 없어 수집을 실행할 수 없습니다."
          exit 1
      - uses: actions/checkout@v4
        if: ${{ env.APP_DATABASE_URL != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.APP_DATABASE_URL != '' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: ${{ env.APP_DATABASE_URL != '' }}
      - name: 수집 1회
        if: ${{ env.APP_DATABASE_URL != '' }}
        env:
          CHANNEL_SLUG: ${{ inputs.channel }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            npm run collect:once -- --check
          elif [ -n "$CHANNEL_SLUG" ]; then
            npm run collect:once -- --channel "$CHANNEL_SLUG"
          else
            npm run collect:once
          fi

