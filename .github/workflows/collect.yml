# 수집 워커 — 한 번 실행 후 종료
# 예약: 매일 KST 07:13 / 19:13 (= UTC 22:13 / 10:13). GitHub 예약 실행은 정시를 보장하지 않습니다.
# 실제 수집 여부는 앱 화면 '오늘의 작업'의 [자동 수집] 스위치(또는 Variables의 AUTO_COLLECT=true)로 정합니다.
# 스위치가 꺼져 있으면 DB만 확인하고 바로 끝납니다. Secrets(APP_DATABASE_URL 등)가 없으면 아무것도 하지 않고 끝납니다.
name: collect
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "채널 slug (비우면 활성 검색어가 있는 모든 채널)"
        required: false
        default: ""
  schedule:
    - cron: "13 10,22 * * *"
permissions:
  contents: read
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      # 화면(채널 설정)에서 입력한 키를 풀기 위한 값 — Render의 APP_SESSION_SECRET과 같은 값
      APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
      APP_SECRETS_KEY: ${{ secrets.APP_SECRETS_KEY }}
      # 아래 키들은 선택: 화면에서 입력했다면 비워 둬도 됩니다(여기 값이 있으면 이 값이 우선)
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
      AUTO_COLLECT: ${{ vars.AUTO_COLLECT || 'false' }}
      AUTO_GENERATE: ${{ vars.AUTO_GENERATE || 'false' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
    steps:
      - name: 연결 정보 확인
        if: ${{ env.APP_DATABASE_URL == '' }}
        run: echo "::notice::Secrets에 APP_DATABASE_URL이 없어 수집을 건너뜁니다(README 7단계)."
      - uses: actions/checkout@v4
        if: ${{ env.APP_DATABASE_URL != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.APP_DATABASE_URL != '' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: ${{ env.APP_DATABASE_URL != '' }}
      - name: 수집 1회
        if: ${{ env.APP_DATABASE_URL != '' }}
        run: |
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            npm run collect:once -- --channel "${{ github.event.inputs.channel }}"
          else
            npm run collect:once
          fi
