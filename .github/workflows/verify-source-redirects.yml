name: Verify source redirects
on:
  push:
    branches: [fix/source-redirects-20261030]
permissions:
  contents: read
concurrency:
  group: verify-source-redirects
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Diagnose failed source redirects (READ ONLY)
        env:
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
        run: ./node_modules/.bin/tsx scripts/diagnose-source-redirects.ts
      - name: Snapshot only tracked application code (no credentials or font assets)
        run: git archive --format=tar.gz --output=source-code.tar.gz HEAD -- client server shared tests scripts package.json package-lock.json tsconfig.json vitest.config.ts vite.config.ts .nvmrc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-redirect-diagnostic
          path: |
            source-redirect-diagnostic.json
            source-code.tar.gz
          retention-days: 3
