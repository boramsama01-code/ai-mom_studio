name: Private collection setup verification
on:
  push:
    branches: [debug/collection-regression-20261106]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENV: production
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      AUTO_COLLECT: ${{ vars.AUTO_COLLECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/check-collection-setup.ts
