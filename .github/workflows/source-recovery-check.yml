name: Public source recovery check
on:
  pull_request:
    paths:
      - server/services/extract.ts
      - server/services/publisherLookup.ts
      - scripts/check-studio-source-recovery.ts
      - .github/workflows/source-recovery-check.yml
permissions:
  contents: read
jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-studio-source-recovery.ts
