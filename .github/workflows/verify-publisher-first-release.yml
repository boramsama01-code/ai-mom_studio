name: Verify publisher-first release
on:
  push:
    branches: [verify/publisher-first-20261031]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check running backend without authentication, collection or writes
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const attempts=[];let verified=false;
          for(let i=0;i<30;i++){
            const row={checkedAt:new Date().toISOString()};
            try{
              const r=await fetch('https://ai-mom-studio.onrender.com/api/health?publisher-check='+Date.now(),{signal:AbortSignal.timeout(10000),headers:{'cache-control':'no-cache'}});
              const data=await r.json();row.status=r.status;row.sourceResolver=data.sourceResolver;row.cardRenderer=data.cardRenderer;
              verified=r.ok&&data.ok===true&&data.sourceResolver==='publisher-direct-v3'&&data.cardRenderer==='adaptive-body-v1';row.verified=verified;
            }catch(e){row.error=e.message;}
            attempts.push(row);console.log(JSON.stringify(row));
            writeFileSync('publisher-first-deployment.json',JSON.stringify({verified,scope:'Public backend health only, no authenticated UI execution or data changes.',attempts},null,2));
            if(verified)break;
            if(i<29)await new Promise(r=>setTimeout(r,10000));
          }
          if(!verified)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-first-deployment
          path: publisher-first-deployment.json
          retention-days: 3
