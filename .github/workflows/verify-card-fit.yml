name: Verify adaptive card layout
on:
  push:
    branches: [fix/card-body-fit-20261031]
permissions:
  contents: read
concurrency:
  group: verify-card-body-fit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aimom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aimom_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/card-body-fit-20261031
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preserve old renderer only for comparison and apply guarded integration
        run: |
          cp server/services/card.ts server/services/cardBeforeFit.ts
          node scripts/apply-card-fit.mjs
      - run: npm ci
      - run: npm run typecheck
      - name: All regression and database/API tests
        run: npm test -- --reporter=default --reporter=json --outputFile=card-fit-test-report.json
      - run: npm run build
      - name: Render actual saved drafts (READ ONLY, no AI or publishing)
        env:
          CARD_DIAGNOSTIC_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
        run: ./node_modules/.bin/tsx scripts/check-saved-card-fit.ts
      - name: Commit only the verified renderer and backend marker
        run: |
          test "${GITHUB_REF_NAME}" = 'fix/card-body-fit-20261031'
          git add server/services/card.ts server/app.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use measured whole-card text layout and expose renderer verification marker'
          git push origin HEAD:fix/card-body-fit-20261031
      - name: Test summary
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          if(existsSync('card-fit-test-report.json')) {
            const r=JSON.parse(readFileSync('card-fit-test-report.json','utf8'));
            console.log(`::notice::${r.numPassedTests}/${r.numTotalTests} tests passed; ${r.numFailedTests} failed; ${r.numPendingTests} pending.`);
            for(const file of r.testResults ?? []) for(const t of file.assertionResults ?? []) if(t.status==='failed') console.log(`::error::${t.fullName}: ${(t.failureMessages??[]).join(' ').replace(/\n/g,'%0A').slice(0,2500)}`);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-fit-verification
          path: |
            card-fit-test-report.json
            card-fit-saved-report.json
            card-fit-previews/*.jpg
          if-no-files-found: ignore
          retention-days: 3
