name: Worker bootstrap check (temporary)
on:
  push:
    branches: [codex/worker-bootstrap-check-20261107]
    paths: [.github/workflows/worker-bootstrap-check-20261107.yml]
permissions:
  contents: read
concurrency:
  group: process
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'boramsama01-code/content-workbench' &&
      github.actor == 'boramsama01-code' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/worker-bootstrap-check-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
      APP_SECRETS_KEY: ${{ secrets.APP_SECRETS_KEY }}
      AUTO_GENERATE: 'false'
      AUTO_PUBLISH: 'false'
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2674fad67a590a0788b79789ef117002b708bb22
          persist-credentials: false
      - name: Verify fixed source revision
        run: test "$(git rev-parse HEAD)" = '2674fad67a590a0788b79789ef117002b708bb22'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare existing production reference assets
        run: node scripts/restore-studio-assets.mjs
      - name: Check production connection without consuming work
        run: npm run collect:once -- --check
