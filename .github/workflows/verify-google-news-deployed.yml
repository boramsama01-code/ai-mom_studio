name: Verify deployed Google News resolver
on:
  push:
    branches: [fix/google-news-resolution-20261029]
permissions:
  contents: read
jobs:
  read-only-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify actual running backend version
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const expected = 'google-news-signed-v1';
          const attempts = [];
          let verified = false;
          for (let attempt = 1; attempt <= 18; attempt++) {
            const row = { checkedAt: new Date().toISOString(), attempt };
            try {
              const response = await fetch('https://ai-mom-studio.onrender.com/api/health?resolver-check=' + Date.now(), { headers: { 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(12000) });
              row.status = response.status;
              const data = await response.json();
              row.ok = data.ok;
              row.sourceResolver = data.sourceResolver ?? null;
              verified = response.ok && data.ok === true && data.sourceResolver === expected;
              row.verified = verified;
            } catch (e) { row.error = e.message; }
            attempts.push(row);
            console.log(JSON.stringify(row));
            writeFileSync('google-news-deployment.json', JSON.stringify({ expected, mergedCommit: '89647029e936e1124f67f7d33d48e12360c24cd2', verified, attempts, productionWrites: 0 }, null, 2));
            if (verified) break;
            if (attempt < 18) await new Promise(r => setTimeout(r, 10000));
          }
          if (!verified) process.exitCode = 1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-google-news-resolver
          path: google-news-deployment.json
          retention-days: 3
