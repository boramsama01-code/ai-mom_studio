name: Targeted build and browser regression
on:
  push:
    branches: [debug/collection-regression-20261106]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spacepenguin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spacepenguin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Production-bundle card rendering
        run: node scripts/cardnews14-memory-qa.mjs --concurrent=2 --output=test-results/cardnews14-memory/ci-production.json
      - name: Install mobile browser tools
        run: npm install --no-save --package-lock=false playwright@1.62.1 && npx playwright install --with-deps webkit
      - name: Mobile layout and channel actions
        run: node scripts/mobile-regression.mjs
      - name: Editing and publication controls
        run: node scripts/content-workspace-regression.mjs
      - name: Eight-page news editor
        run: node --import tsx scripts/news-editorial-regression.mjs
      - name: Channel navigation
        run: node scripts/channel-navigation-regression.mjs
      - name: Automatic images and previews
        run: node scripts/studio-automatic-regression.mjs
