name: Verify source redirect release
on:
  push:
    branches: [verify/source-redirects-20261030]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check running backend version (no authentication or writes)
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const attempts=[]; let verified=false;
          for(let i=0;i<20;i++){
            const row={checkedAt:new Date().toISOString()};
            try{
              const r=await fetch('https://ai-mom-studio.onrender.com/api/health?source-check='+Date.now(),{signal:AbortSignal.timeout(10000),headers:{'cache-control':'no-cache'}});
              const data=await r.json();
              row.status=r.status; row.sourceResolver=data.sourceResolver??null;
              verified=r.ok&&data.ok===true&&data.sourceResolver==='google-news-redirect-v2';
              row.verified=verified;
            }catch(e){row.error=e.message;}
            attempts.push(row); console.log(JSON.stringify(row));
            writeFileSync('source-redirect-deployment.json',JSON.stringify({verified,attempts},null,2));
            if(verified)break;
            if(i<19)await new Promise(r=>setTimeout(r,10000));
          }
          if(!verified)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-redirect-deployment
          path: source-redirect-deployment.json
          retention-days: 3
